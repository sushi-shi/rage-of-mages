# facts — sha256, bytes, containers, manifest strings, filename-derived
# device/resolution — are trustworthy). The JUDGMENT calls were reconciled by
# hand in Phase 1 (see PHASE 1 RECONCILIATION below); edit this file by hand.
#
# `just originals-verify` reconciles every materialized payload against the
# sha256 + bytes table below (both [[payload]] and [[archived]]); `--self-test`
# proves the gate can fail.
#
# SAME-GAME MERGE (confirmed by bytecode/resource fingerprint, playbook R10):
# "Allods" (Russian title) and "Rage of Mages" (Western title) are ONE Nival
# game — one codebase, packaged for different devices and regions. Evidence:
#   - all four builds share MIDlet-Vendor "Nival Interactive" and launch the
#     same class `Container/GameMIDlet`;
#   - the 12 campaign levels res/1.map .. res/12.map are BYTE-IDENTICAL across
#     ALL FOUR builds (CRC-32 verified) — the same game content, so level data
#     is build-independent (parse once);
#   - class bytecode is recompiled per device (0 byte-identical classes), and
#     the .utf localization tables differ (RU vs EN) — the device + region/title
#     axis, not a different game.
# Canonical slug = the international name `rage-of-mages`.
#
# PHASE 1 RECONCILIATION (2026-08-28) — target set + build roles decided from
# the bytes (CRC-32 resource identity + obfuscated class-NAME-set comparison):
#   - allods_176x220 and Rage-of-Mages_EN_v11 have an IDENTICAL 37-class name
#     set — the SAME program, differing only in language (RU vs EN) + recompile.
#     (This CORRECTS the original auto-generated note, which compared 240x320 to
#     EN and called it "31/31 shared" — misleading: 240x320 is a *subset*.)
#   - allods_240x320 is a REDUCED 31-class strict subset (missing classes ae–aj
#     + the multiplayer maps net0..4/101.map) on MIDP-1.0 — an official but
#     low-end/cut-down port, NOT the most complete build.
#   - allods_128x160 ("by Etty") is a 32-class reduced fan repack.
# DECISION (user, 2026-08-28): ship the port in ENGLISH, anchored to OFFICIAL
# behavior. Behavior/levels/sprites come from the baseline allods_176x220
# (official RU, full content); the shipped English text comes from
# Rage-of-Mages_EN_v11's .utf (its class set is identical to the baseline, so
# strings map 1:1). Both are kept as active [[payload]] sources. The two
# out-of-scope builds (128x160 Etty repack; 240x320 reduced variant) are moved
# to [[archived]] — preserved + still verified, but not recovery targets. Bytes
# are kept (non-destructive); nothing deleted from the provenance store.

