# Reviewed naming authority for Rage of Mages / Allods (Nival, J2ME 2D).
#
# This file is the ONE tracked owner of obfuscated -> semantic identity for the
# baseline's transliteration surface (rulebook R10: identity/naming is assigned
# from SHAPE and behaviour, never inferred from the obfuscated single letter).
# There is no separately buildable named-Java app; this ledger is what a
# transliterator consults to know what an obfuscated `class.member` means.
#
# SCOPE: the baseline `allods_176x220` (behaviour authority; 37 obfuscated
# classes launching `Container/GameMIDlet`). Obfuscated names are STABLE within a
# build but recompiled per device, so a name assigned here holds for the baseline
# and — because `Rage-of-Mages_EN_v11` shares the baseline's exact class-NAME set
# (builds.toml Phase-1 reconciliation) — for that English fork too.
#
# KEYS: obfuscated names collide heavily — the obfuscator reuses `a` for dozens of
# unrelated members, distinguished only by descriptor (baseline class `m` alone
# has 231 fields / 162 methods). Every member is therefore keyed by its JVM-level
# `(obf, descriptor)` pair, which is unique within a class and stable — NOT by a
# decompiler's invented disambiguations (`m38a`, `f251o`).
#
# EVIDENCE: each name cites the class/method (and the doc that reversed it) that
# supports it. `confidence` is high / medium / low. This ledger does NOT claim to
# name all 37 classes or every member; it seeds the class roles and the members
# established in Phase 1 (docs/FORMATS.md + docs/DEVICE_RUNTIME.md), and only
# asserts names the bytecode + that evidence support. Uncertain members are left
# out (R10) rather than named on a guess; overload disambiguations that are an
# inference (not stated verbatim in the evidence) are flagged medium.
#
# INTEGRITY: `tools/java/validate_symbols.py` asserts every (obf, descriptor) here
# is a REAL member of that class in the baseline bytecode (parsed straight from
# the jar by tools/java/classfile.py — the bytecode is the authority, R2), so the
# ledger cannot drift from reality; `--self-test` proves the gate can go red.
#
# The arithmetic each named method must reproduce is pinned separately, straight
# from the bytecode, in `_reference/numeric-shapes.json` (rulebook R8; produced by
# tools/java/validate_numeric_shape.py). Consult BOTH before porting a method.

baseline = "allods_176x220_176x220_03"

